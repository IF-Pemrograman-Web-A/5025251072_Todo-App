<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main style="text-align: center; padding: 3rem 1rem;">
        <h1>Kamu sedang offline</h1>
        <p>Koneksi tidak tersedia. Halaman yang pernah dibuka sebelumnya masih dapat diakses. Coba lagi setelah tersambung</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
